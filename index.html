<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroCoOp — Профессиональный поиск кооператива</title>
<style>
  /* ── Fonts & Vars ── */
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --bg: #08080c; --surface: #101018; --card: #151520; --border: #252535;
    --accent: #8b5cf6; --accent-glow: rgba(139,92,246,.2);
    --text: #ececf3; --muted: #71718a; --green: #10b981; --radius: 14px;
  }

  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.5; }

  /* ── Layout ── */
  .layout { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  
  /* ── Sidebar ── */
  aside {
    background: var(--surface); border-right: 1px solid var(--border); padding: 2rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 100;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; font-weight: 700; margin-bottom: 2.5rem; }
  .logo span { color: var(--accent); }
  
  .filter-group { margin-bottom: 1.5rem; }
  .label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; letter-spacing: .05em; }
  input, select {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: .75rem 1rem; border-radius: 10px; outline: none; font-family: inherit; transition: .2s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  
  .btn-search {
    width: 100%; background: var(--accent); color: #fff; border: none; padding: 1rem;
    border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: .2s;
  }
  .btn-search:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-search:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Main ── */
  main { padding: 2rem; position: relative; }
  .header-actions { display: flex; justify-content: flex-end; margin-bottom: 2rem; }
  .btn-api { background: none; border: 1px solid var(--border); color: var(--muted); padding: .5rem 1rem; border-radius: 8px; cursor: pointer; font-size: .8rem; }

  .results-info { margin-bottom: 1.5rem; font-family: 'Space Mono', monospace; font-size: .85rem; color: var(--muted); }
  .results-info strong { color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }

  /* ── Card ── */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; transition: .25s; animation: fadeIn .4s ease-out both;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 12px 32px rgba(0,0,0,.4); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-img-wrap { position: relative; aspect-ratio: 3/4; background: #000; overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; transition: .5s; }
  .card:hover .card-img { transform: scale(1.05); opacity: .8; }
  
  .card-score {
    position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,.8); backdrop-filter: blur(4px);
    padding: .3rem .6rem; border-radius: 6px; font-weight: 700; font-family: 'Space Mono', monospace; font-size: .8rem;
  }
  .score-high { color: var(--green); border: 1px solid var(--green); }
  .score-med { color: #f59e0b; border: 1px solid #f59e0b; }

  .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; gap: .75rem; }
  .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
  
  .card-tags { display: flex; gap: .5rem; flex-wrap: wrap; }
  .tag { font-size: .65rem; font-weight: 700; padding: .2rem .5rem; border-radius: 4px; text-transform: uppercase; background: var(--bg); color: var(--muted); }
  .tag-platform { color: var(--accent); border: 1px solid var(--accent-glow); }

  .card-players { display: flex; align-items: center; gap: .5rem; font-size: .9rem; font-weight: 500; color: #fff; }
  .card-players span { color: var(--accent); }

  /* ── Modal ── */
  .modal {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.9); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); padding: 2.5rem; border-radius: 20px; width: 100%; max-width: 450px; }
  .modal h2 { margin-bottom: 1rem; font-family: 'Space Mono', monospace; }
  .modal p { color: var(--muted); font-size: .9rem; margin-bottom: 2rem; }
  
  /* ── States ── */
  .empty-state { grid-column: 1/-1; text-align: center; padding: 5rem 0; opacity: .3; }
  .empty-state i { font-size: 4rem; display: block; margin-bottom: 1rem; }

  .skeleton { background: var(--card); height: 400px; border-radius: var(--radius); position: relative; overflow: hidden; }
  .skeleton::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
    animation: loading 1.5s infinite;
  }
  @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="modal" id="apiModal">
  <div class="modal-content">
    <h2>Настройка API</h2>
    <p>Введите ваши ключи для работы поиска. Они сохраняются локально.</p>
    <form id="apiForm">
      <input type="text" name="dummy" style="display:none;" autocomplete="username">
      <div class="filter-group">
        <label class="label">TheGamesDB API Key</label>
        <input type="password" id="tgdbKey" placeholder="Ваш ключ (api.thegamesdb.net)" required autocomplete="current-password">
      </div>
      <div class="filter-group">
        <label class="label">RAWG.io API Key</label>
        <input type="password" id="rawgKey" placeholder="Ваш ключ (rawg.io)" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-search">💾 Сохранить и продолжить</button>
      <button type="button" class="btn-api" style="width:100%; margin-top:.5rem;" id="clearKeys">🗑️ Очистить всё</button>
    </form>
  </div>
</div>

<div class="layout">
  <aside>
    <div class="logo">Retro<span>CoOp</span></div>
    
    <div class="filter-group">
      <label class="label">Название игры</label>
      <input type="text" id="searchTitle" placeholder="Напр: Contra, Mario...">
    </div>

    <div class="filter-group">
      <label class="label">Платформа</label>
      <select id="platform">
        <option value="">Все платформы</option>
        <option value="7">NES (Dendy)</option>
        <option value="6">SNES</option>
        <option value="36">Sega Genesis</option>
        <option value="2">Arcade (MAME)</option>
        <option value="10">PlayStation 1</option>
        <option value="11">PlayStation 2</option>
        <option value="3">Nintendo 64</option>
        <option value="4">Game Boy Advance</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="label">Мин. игроков (точно)</label>
      <input type="number" id="minPlayers" value="2" min="1" max="16">
    </div>

    <div class="filter-group">
      <label class="label">Год выхода</label>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: .5rem;">
        <input type="number" id="yearFrom" value="1980" min="1970">
        <input type="number" id="yearTo" value="2005" min="1970">
      </div>
    </div>

    <button class="btn-search" id="searchBtn">🔍 Найти игры</button>
  </aside>

  <main>
    <div class="header-actions">
      <button class="btn-api" id="openSettings">⚙️ Настройки API</button>
    </div>

    <div class="results-info" id="resultsInfo">Готов к поиску...</div>
    
    <div class="grid" id="gameGrid">
      <div class="empty-state">
        <i>🕹️</i>
        <p>Используйте фильтры слева, чтобы найти игры</p>
      </div>
    </div>
  </main>
</div>

<script>
/** ── Config ── **/
const CONFIG = {
  tgdb: localStorage.getItem('THEGAMESDB_KEY') || '',
  rawg: localStorage.getItem('RAWG_KEY') || ''
};

const TGDB_BASE = 'https://api.thegamesdb.net/v1';
const RAWG_BASE = 'https://api.rawg.io/api';
const PROXY = 'https://corsproxy.io/?url=';

const PLATFORMS = {
  '7': 'NES', '6': 'SNES', '36': 'Genesis', '2': 'Arcade', '10': 'PS1', '11': 'PS2', '3': 'N64', '4': 'GBA'
};

/** ── UI ── **/
const $ = id => document.getElementById(id);
const toggleModal = (show) => $('apiModal').classList.toggle('active', show);

if (!CONFIG.tgdb || !CONFIG.rawg) toggleModal(true);

$('apiForm').onsubmit = (e) => {
  e.preventDefault();
  const t = $('tgdbKey').value.trim();
  const r = $('rawgKey').value.trim();
  if (t && r) {
    localStorage.setItem('THEGAMESDB_KEY', t);
    localStorage.setItem('RAWG_KEY', r);
    location.reload();
  }
};

$('clearKeys').onclick = () => { if(confirm('Удалить ключи?')) { localStorage.clear(); location.reload(); } };
$('openSettings').onclick = () => toggleModal(true);

/** ── Core Engine ── **/
let isLoading = false;

$('searchBtn').onclick = async () => {
  if (isLoading) return;
  const title = $('searchTitle').value.trim();
  const platform = $('platform').value;
  const minPlayers = parseInt($('minPlayers').value) || 1;
  const yFrom = parseInt($('yearFrom').value) || 0;
  const yTo = parseInt($('yearTo').value) || 9999;

  startLoading();
  
  try {
    // 1. Fetch from TheGamesDB
    let tgdbUrl = title 
      ? `${TGDB_BASE}/Games/ByGameName?name=${encodeURIComponent(title)}`
      : `${TGDB_BASE}/Games/ByPlatformID?id=${platform || Object.keys(PLATFORMS).join(',')}`;
    
    tgdbUrl += `&apikey=${CONFIG.tgdb}&fields=players,release_date&include=boxart`;
    
    const res = await fetch(PROXY + encodeURIComponent(tgdbUrl));
    const json = await res.json();
    if (json.status !== 'Success') throw new Error(json.status);

    const rawGames = json.data.games || [];
    const boxartData = json.include?.boxart || {};

    // 2. Filter accurately by players and dates
    const filtered = rawGames.filter(g => {
      const p = extractPlayers(g.players);
      const y = g.release_date ? parseInt(g.release_date.slice(0,4)) : 0;
      return p >= minPlayers && y >= yFrom && y <= yTo;
    });

    // 3. Map to clean objects
    const games = filtered.map(g => {
      const thumb = findThumb(g.id, boxartData);
      return { id: g.id, title: g.game_title, players: extractPlayers(g.players), platform: g.platform, year: g.release_date?.slice(0,4), thumb };
    });

    renderInitial(games);
    updateInfo(`Найдено ${games.length} игр. Загружаем детали...`);

    // 4. Enrich with RAWG in background
    enrichGames(games);

  } catch (err) {
    alert('Ошибка API: ' + err.message);
  } finally {
    stopLoading();
  }
};

function extractPlayers(val) {
  if (!val) return 1;
  const m = String(val).match(/\d+/g);
  return m ? Math.max(...m.map(Number)) : 1;
}

function findThumb(gid, data) {
  if (!data.data || !data.data[gid]) return null;
  const imgs = data.data[gid];
  const front = imgs.find(i => i.side === 'front') || imgs[0];
  return data.base_url.thumb + front.filename;
}

/** ── Rendering ── **/
function renderInitial(games) {
  const grid = $('gameGrid');
  grid.innerHTML = games.length ? '' : '<div class="empty-state">Ничего не найдено</div>';
  
  games.forEach(g => {
    const el = document.createElement('div');
    el.className = 'card';
    el.id = `game-${g.id}`;
    el.innerHTML = `
      <div class="card-img-wrap">
        <img src="${g.thumb || ''}" class="card-img" onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
        <div class="card-score" style="display:none"></div>
      </div>
      <div class="card-body">
        <div class="card-tags">
          <span class="tag tag-platform">${PLATFORMS[g.platform] || 'Retro'}</span>
          <span class="tag">${g.year || '????'}</span>
        </div>
        <div class="card-title">${g.title}</div>
        <div class="card-players"><span>👥</span> ${g.players} игроков</div>
      </div>
    `;
    grid.appendChild(el);
  });
}

async function enrichGames(games) {
  // Обрабатываем пачками по 5, чтобы не вешать браузер
  for (let i = 0; i < games.length; i++) {
    const g = games[i];
    fetchRAWG(g.title).then(data => {
      if (!data) return;
      const card = $(`game-${g.id}`);
      if (!card) return;

      // Обновляем обложку на более качественную
      if (data.background_image) {
        card.querySelector('.card-img').src = data.background_image;
      }

      // Добавляем рейтинг
      if (data.metacritic) {
        const score = card.querySelector('.card-score');
        score.textContent = data.metacritic;
        score.style.display = 'block';
        score.classList.add(data.metacritic >= 75 ? 'score-high' : 'score-med');
      }

      // Добавляем теги
      const tagContainer = card.querySelector('.card-tags');
      const isCoop = data.tags?.some(t => ['co-op', 'local-co-op', 'split-screen'].includes(t.slug));
      if (isCoop) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.style.color = '#10b981';
        tag.textContent = '🤝 CO-OP';
        tagContainer.appendChild(tag);
      }
    });
  }
}

async function fetchRAWG(title) {
  try {
    const url = `${RAWG_BASE}/games?key=${CONFIG.rawg}&search=${encodeURIComponent(title)}&page_size=1`;
    const res = await fetch(url);
    const data = await res.json();
    return data.results?.[0];
  } catch { return null; }
}

function startLoading() {
  isLoading = true;
  $('searchBtn').disabled = true;
  $('searchBtn').textContent = '⏳ Поиск...';
  $('gameGrid').innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
}

function stopLoading() {
  isLoading = false;
  $('searchBtn').disabled = false;
  $('searchBtn').textContent = '🔍 Найти игры';
}

function updateInfo(txt) { $('resultsInfo').textContent = txt; }
</script>
</body>
</html>
