<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroCoOp — поиск кооперативных игр</title>
<style>
  /* ── Fonts ── */
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  /* ── Variables ── */
  :root {
    --bg:          #0a0a0f;
    --surface:     #111118;
    --card:        #16161f;
    --card-hover:  #1c1c28;
    --border:      #2a2a3a;
    --accent:      #7c3aed;
    --accent-dim:  #5b21b6;
    --accent-glow: rgba(124,58,237,.25);
    --text:        #e8e8f0;
    --muted:       #6b6b80;
    --green:       #22c55e;
    --yellow:      #eab308;
    --red:         #ef4444;
    --radius:      12px;
    --transition:  .18s ease;
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 4px);
    pointer-events: none;
  }

  /* ── Header ── */
  header {
    position: relative;
    padding: 2rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(124,58,237,.08) 0%, transparent 100%);
    z-index: 10;
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 1.6rem; font-weight: 700; letter-spacing: -.5px; color: var(--text); }
  .logo span { color: var(--accent); }
  .logo-sub { font-size: .75rem; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: .1em; margin-top: .1rem; }
  
  .btn-settings {
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); padding: .5rem .75rem; border-radius: 8px;
    font-size: .75rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: .5rem;
    transition: var(--transition);
    font-family: 'DM Sans', sans-serif;
    margin-left: auto;
  }
  .btn-settings:hover { border-color: var(--accent); color: var(--text); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .modal-overlay.visible { display: flex; }
  .modal-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); width: 100%; max-width: 440px;
    padding: 2rem; box-shadow: 0 24px 64px rgba(0,0,0,.5);
    position: relative;
  }
  .modal-card h2 { font-family: 'Space Mono', monospace; font-size: 1.35rem; margin-bottom: .75rem; color: var(--text); }
  .modal-card p { font-size: .88rem; color: var(--muted); margin-bottom: 1.5rem; }
  .modal-input-group { margin-bottom: 1rem; }
  .modal-input-group label {
    display: block; font-size: .75rem; font-weight: 700;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: .4rem; letter-spacing: .1em;
  }
  .modal-card input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: .7rem 1rem;
    font-size: .95rem; outline: none; transition: var(--transition);
  }
  .modal-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .btn-save {
    width: 100%; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: .8rem;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    margin-top: .5rem; transition: var(--transition);
    font-family: 'DM Sans', sans-serif;
  }
  .btn-save:hover { background: var(--accent-dim); transform: translateY(-1px); }

  /* ── Layout ── */
  .layout {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: 300px 1fr; gap: 0;
    min-height: calc(100vh - 120px); position: relative; z-index: 1;
  }

  /* ── Sidebar ── */
  aside {
    padding: 1.5rem; border-right: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .sidebar-title { font-family: 'Space Mono', monospace; font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.25rem; }
  .filter-group { margin-bottom: 1.25rem; }
  .filter-label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; letter-spacing: .04em; }
  input[type="text"], input[type="number"], select {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: .65rem .75rem;
    font-family: 'DM Sans', sans-serif; font-size: .9rem;
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  
  .year-row { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .btn-search {
    width: 100%; margin-top: 1.5rem; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: .8rem; font-size: .95rem; font-weight: 600; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: var(--transition);
  }
  .btn-search:hover { background: #6d28d9; transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
  .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

  /* ── Main content ── */
  main { padding: 1.5rem; }
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .results-count { font-family: 'Space Mono', monospace; font-size: .8rem; color: var(--muted); }
  .error-banner { display: none; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; font-size: .85rem; }
  .error-banner.visible { display: flex; gap: .5rem; }

  /* ── Grid ── */
  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
  
  /* ── Card ── */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; transition: var(--transition); animation: fadeUp .3s ease both;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: var(--surface); }
  .card-body { padding: 1rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
  .card-title { font-size: .95rem; font-weight: 600; line-height: 1.3; }
  .card-meta { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .badge { padding: .2rem .6rem; border-radius: 6px; font-size: .7rem; font-weight: 700; text-transform: uppercase; }
  .badge-platform { background: var(--surface); color: var(--accent); border: 1px solid var(--border); }
  .card-score { font-family: 'Space Mono', monospace; font-weight: 700; font-size: .75rem; padding: .2rem .5rem; border-radius: 4px; }
  .score-green { background: rgba(34,197,94,.15); color: var(--green); }
  .score-yellow { background: rgba(234,179,8,.15); color: var(--yellow); }
  .score-none { background: var(--surface); color: var(--muted); }
  .card-players { font-size: .8rem; color: var(--text); font-weight: 500; display: flex; align-items: center; gap: .4rem; }
  .card-coop { font-size: .75rem; color: var(--accent); font-weight: 500; }

  /* ── States ── */
  .empty-state { display: none; flex-direction: column; align-items: center; padding: 4rem 1rem; text-align: center; }
  .empty-state.visible { display: flex; }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .3; }
  
  .load-more-wrap { display: flex; justify-content: center; margin-top: 2rem; }
  .btn-more { display: none; background: transparent; border: 1px solid var(--border); color: var(--text); padding: .7rem 2rem; border-radius: 8px; cursor: pointer; transition: var(--transition); }
  .btn-more.visible { display: block; }
  .btn-more:hover { border-color: var(--accent); background: var(--accent-glow); }

  /* ── Skeleton ── */
  .skel-card { background: var(--card); border-radius: var(--radius); height: 320px; animation: shimmer 1.5s infinite linear; background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%); background-size: 200% 100%; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } aside { height: auto; position: static; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo">Retro<span>CoOp</span></div>
      <div class="logo-sub">// поиск точного количества игроков в ретро-играх</div>
    </div>
    <button class="btn-settings" id="openSettingsBtn"><span>⚙️</span> Настройки API</button>
  </div>
</header>

<div class="modal-overlay" id="keysModal">
  <form class="modal-card" id="keysForm">
    <input type="text" name="username" value="api-user" style="display:none;" autocomplete="username">
    <h2>Настройка ключей</h2>
    <p>Для работы нужны оба ключа. Они сохраняются только в вашем браузере.</p>
    
    <div class="modal-input-group">
      <label for="tgdbInput">TheGamesDB API Key</label>
      <input type="password" id="tgdbInput" placeholder="Ключ от api.thegamesdb.net" required autocomplete="current-password">
    </div>
    
    <div class="modal-input-group">
      <label for="rawgInput">RAWG.io API Key</label>
      <input type="password" id="rawgInput" placeholder="Ключ от rawg.io" required autocomplete="current-password">
    </div>
    
    <button type="submit" class="btn-save">💾 Сохранить и закрыть</button>
    <button type="button" class="btn-save" id="clearKeysBtn" style="background:none; border:1px solid var(--border); margin-top:.75rem; color:var(--muted)">🗑️ Сбросить ключи</button>
  </form>
</div>

<div class="layout">
  <aside>
    <div class="sidebar-title">// Параметры поиска</div>
    
    <div class="filter-group">
      <label class="filter-label">Поиск по названию</label>
      <input type="text" id="searchTitle" placeholder="Напр: Contra, Mario...">
    </div>

    <div class="filter-group">
      <label class="filter-label">Платформа</label>
      <select id="platform">
        <option value="">Все платформы</option>
        <option value="7">NES</option>
        <option value="6">SNES</option>
        <option value="36">Sega Genesis</option>
        <option value="2">Arcade</option>
        <option value="10">PS1</option>
        <option value="11">PS2</option>
        <option value="3">N64</option>
        <option value="4">GBA</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Мин. игроков (точно)</label>
      <input type="number" id="minPlayers" value="2" min="1" max="16">
    </div>

    <div class="filter-group">
      <label class="filter-label">Год выхода</label>
      <div class="year-row">
        <input type="number" id="yearFrom" value="1980" min="1970" max="2025">
        <input type="number" id="yearTo" value="2010" min="1970" max="2025">
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">Сортировка</label>
      <select id="sortBy">
        <option value="rating_desc">Рейтинг ↓</option>
        <option value="year_desc">Новые ↓</option>
        <option value="year_asc">Старые ↑</option>
        <option value="name_asc">Название А–Я</option>
      </select>
    </div>

    <button class="btn-search" id="btnSearch">🚀 Найти кооператив</button>
  </aside>

  <main>
    <div class="error-banner" id="errorBanner"><span>❌</span><span id="errorText"></span></div>
    
    <div class="results-header">
      <div class="results-count" id="resultsCount">Введите параметры и нажмите «Найти»</div>
    </div>

    <div class="games-grid" id="gamesGrid"></div>

    <div class="empty-state visible" id="emptyState">
      <div class="empty-icon">🕹️</div>
      <div class="empty-title">Готов к точному поиску</div>
      <div class="empty-sub">Данные о игроках берутся из TheGamesDB</div>
    </div>

    <div class="load-more-wrap">
      <button class="btn-more" id="btnMore">Показать еще</button>
    </div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   Config & State
   ═══════════════════════════════════════════════════════ */
const CONFIG = {
  tgdbKey: localStorage.getItem('THEGAMESDB_KEY') || '',
  rawgKey: localStorage.getItem('RAWG_KEY') || ''
};

let state = {
  games: [],
  page: 1,
  totalPages: 1,
  loading: false
};

const $ = id => document.getElementById(id);

const PLATFORM_MAP = {
  '7':  { name: 'NES', cls: 'nes' },
  '6':  { name: 'SNES', cls: 'snes' },
  '36': { name: 'Sega Genesis', cls: 'genesis' },
  '2':  { name: 'Arcade', cls: 'arcade' },
  '10': { name: 'PS1', cls: 'ps1' },
  '11': { name: 'PS2', cls: 'ps2' },
  '3':  { name: 'N64', cls: 'n64' },
  '4':  { name: 'GBA', cls: 'gba' },
};

/* ═══════════════════════════════════════════════════════
   UI
   ═══════════════════════════════════════════════════════ */
function updateKeyUI() {
  if (!CONFIG.tgdbKey || !CONFIG.rawgKey) $('keysModal').classList.add('visible');
  else $('keysModal').classList.remove('visible');
}

$('keysForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const tgdb = $('tgdbInput').value.trim();
  const rawg = $('rawgInput').value.trim();
  if (tgdb && rawg) {
    localStorage.setItem('THEGAMESDB_KEY', tgdb);
    localStorage.setItem('RAWG_KEY', rawg);
    CONFIG.tgdbKey = tgdb;
    CONFIG.rawgKey = rawg;
    updateKeyUI();
    startSearch();
  }
});

$('clearKeysBtn').addEventListener('click', () => {
  if (confirm('Сбросить ключи API?')) {
    localStorage.removeItem('THEGAMESDB_KEY');
    localStorage.removeItem('RAWG_KEY');
    location.reload();
  }
});

$('openSettingsBtn').addEventListener('click', () => $('keysModal').classList.add('visible'));

/* ═══════════════════════════════════════════════════════
   Search Logic (TheGamesDB primary)
   ═══════════════════════════════════════════════════════ */
const CORS_PROXY_BASE = 'https://corsproxy.io/?url=';
const TGDB_BASE  = 'https://api.thegamesdb.net/v1';
const RAWG_BASE  = 'https://api.rawg.io/api';

async function startSearch() {
  if (!CONFIG.tgdbKey || !CONFIG.rawgKey) { updateKeyUI(); return; }
  state.page = 1;
  state.games = [];
  $('gamesGrid').innerHTML = '';
  $('emptyState').classList.remove('visible');
  $('errorBanner').classList.remove('visible');
  fetchPage(1);
}

async function loadMore() {
  if (state.loading || state.page >= state.totalPages) return;
  state.page++;
  fetchPage(state.page);
}

async function fetchPage(page) {
  state.loading = true;
  $('btnSearch').disabled = true;
  $('btnSearch').textContent = '⏳ Загрузка...';
  showSkeletons();

  const title    = $('searchTitle').value.trim();
  const platform = $('platform').value;
  const minPlay  = parseInt($('minPlayers').value) || 1;
  const yearFrom = parseInt($('yearFrom').value) || 0;
  const yearTo   = parseInt($('yearTo').value)   || 9999;

  try {
    // 1. Fetch from TheGamesDB (for accurate players and list)
    const url = new URL(`${TGDB_BASE}/Games/ByGameName`);
    url.searchParams.set('apikey', CONFIG.tgdbKey);
    url.searchParams.set('name', title || 'a'); 
    url.searchParams.set('page', page);
    url.searchParams.set('fields', 'players,release_date,overview');
    url.searchParams.set('include','boxart');
    if (platform) url.searchParams.set('filter[platform]', platform);
    else url.searchParams.set('filter[platform]', Object.keys(PLATFORM_MAP).join(','));

    const res = await fetch(CORS_PROXY_BASE + encodeURIComponent(url.toString()));
    const json = await res.json();
    if (json.status !== 'Success') throw new Error(json.status || 'Ошибка TGDB');

    const data = json.data;
    state.totalPages = Math.ceil((data.count || 0) / 20);

    const boxartMap = {};
    if (json.include?.boxart?.data) {
      const ba = json.include.boxart.data;
      const baseUrl = json.include.boxart.base_url?.thumb || '';
      for (const gid in ba) {
        const imgs = ba[gid];
        const front = imgs.find(i => i.side === 'front') || imgs[0];
        if (front) boxartMap[gid] = baseUrl + front.filename;
      }
    }

    // 2. Filter TGDB results locally by exact players and years
    const tgdbGames = (data.games || []).filter(g => {
      const players = extractPlayers(g);
      const year = g.release_date ? parseInt(g.release_date.slice(0,4)) : 0;
      if (players < minPlay) return false;
      if (year < yearFrom || year > yearTo) return false;
      return true;
    }).map(g => ({ ...g, _thumb: boxartMap[String(g.id)] || null }));

    // 3. Enrich with RAWG (Parallel)
    const rawgMap = await fetchRAWGBatch(tgdbGames.map(g => g.game_title));

    // 4. Merge
    const merged = tgdbGames.map(g => {
      const r = rawgMap[normalizeTitle(g.game_title)] || {};
      return {
        id: g.id,
        title: g.game_title,
        year: g.release_date ? g.release_date.slice(0, 4) : null,
        platform_id: String(g.platform),
        players: extractPlayers(g),
        thumb: g._thumb || null,
        metacritic: r.metacritic || null,
        coopType: extractCoop(r.tags || []),
        description: r.description || null
      };
    });

    state.games.push(...merged);
    sortGames();
    removeSkeletons();
    renderCards(merged);
    updateCount();
    
    if (page < state.totalPages) $('btnMore').classList.add('visible');
    else $('btnMore').classList.remove('visible');

    if (state.games.length === 0 && page === 1) showEmpty();

  } catch (err) {
    removeSkeletons();
    $('errorText').textContent = err.message;
    $('errorBanner').classList.add('visible');
  } finally {
    state.loading = false;
    $('btnSearch').disabled = false;
    $('btnSearch').textContent = '🚀 Найти кооператив';
  }
}

async function fetchRAWGBatch(titles) {
  if (!CONFIG.rawgKey) return {};
  const map = {};
  const requests = titles.map(async title => {
    try {
      const url = `${RAWG_BASE}/games?key=${CONFIG.rawgKey}&search=${encodeURIComponent(title)}&page_size=1`;
      const res = await fetch(url);
      if (!res.ok) return;
      const json = await res.json();
      const g = json.results?.[0];
      if (g) {
        map[normalizeTitle(title)] = {
          metacritic: g.metacritic || null,
          tags: (g.tags || []).map(t => t.slug),
          description: g.description_raw || null
        };
      }
    } catch {}
  });
  await Promise.allSettled(requests);
  return map;
}

/* ═══════════════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════════════ */
function normalizeTitle(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ''); }

function extractPlayers(g) {
  if (!g.players) return 1;
  const m = String(g.players).match(/\d+/g);
  return m ? Math.max(...m.map(Number)) : 1;
}

function extractCoop(tags) {
  const coopTags = ['co-op', 'local-co-op', 'split-screen'];
  if (tags.some(t => coopTags.includes(t))) return '🤝 Кооператив';
  return null;
}

function sortGames() {
  const by = $('sortBy').value;
  state.games.sort((a, b) => {
    if (by === 'rating_desc') return (b.metacritic || -1) - (a.metacritic || -1);
    if (by === 'year_desc') return (b.year || 0) - (a.year || 0);
    if (by === 'year_asc') return (a.year || 9999) - (b.year || 9999);
    return a.title.localeCompare(b.title, 'ru');
  });
}

function renderCards(games) {
  games.forEach(g => {
    const pInfo = PLATFORM_MAP[g.platform_id] || { name: 'Other', cls: 'other' };
    const ratingClass = g.metacritic >= 75 ? 'score-green' : (g.metacritic >= 50 ? 'score-yellow' : 'score-none');
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img class="card-thumb" src="${g.thumb || ''}" alt="${g.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-thumb-placeholder" style="display:none; height:240px; background:var(--surface); align-items:center; justify-content:center; font-size:3rem;">🕹️</div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="card-meta">
          <span class="badge badge-platform">${pInfo.name}</span>
          ${g.metacritic ? `<span class="card-score ${ratingClass}">${g.metacritic}</span>` : ''}
        </div>
        <div class="card-players">👥 до ${g.players} игроков</div>
        ${g.coopType ? `<div class="card-coop">${g.coopType}</div>` : ''}
      </div>
    `;
    $('gamesGrid').appendChild(card);
  });
}

function showSkeletons() {
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('div');
    s.className = 'skel-card';
    $('gamesGrid').appendChild(s);
  }
}
function removeSkeletons() { document.querySelectorAll('.skel-card').forEach(el => el.remove()); }
function showEmpty() { $('emptyState').classList.add('visible'); }
function updateCount() {
  const n = state.games.length;
  $('resultsCount').innerHTML = n > 0 ? `Найдено: <strong>${n}</strong> игр` : 'Ничего не найдено';
}

$('btnSearch').addEventListener('click', startSearch);
$('btnMore').addEventListener('click', loadMore);
updateKeyUI();
</script>
</body>
</html>
