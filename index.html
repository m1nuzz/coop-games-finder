<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroCoOp — Масштабный поиск</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --bg: #050508; --surface: #0a0a0f; --card: #11111d; --border: #1d1d2b;
    --accent: #8b5cf6; --accent-glow: rgba(139,92,246,.3);
    --text: #e2e2ec; --muted: #66667a; --green: #10b981; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; overflow-x: hidden; }

  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  
  aside {
    background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 100;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 1.3rem; font-weight: 700; margin-bottom: 2rem; color: #fff; }
  .logo span { color: var(--accent); }
  
  .filter-group { margin-bottom: 1rem; }
  .label { display: block; font-size: .65rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; letter-spacing: .08em; }
  input, select {
    width: 100%; background: var(--card); border: 1px solid var(--border); color: #fff;
    padding: .6rem .8rem; border-radius: 8px; outline: none; font-size: .85rem; transition: .2s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  
  .btn-search {
    width: 100%; background: var(--accent); color: #fff; border: none; padding: .8rem;
    border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: .5rem; transition: .2s;
  }
  .btn-search:hover { transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-glow); }
  .btn-search:disabled { opacity: .5; cursor: wait; }

  main { padding: 1.5rem; }
  .results-info { margin-bottom: 1.5rem; font-family: 'Space Mono', monospace; font-size: .75rem; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }

  /* ── Card ── */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; transition: .2s; animation: fadeIn .3s ease both;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-img-wrap { position: relative; aspect-ratio: 3/4; background: #000; overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; opacity: .8; transition: .5s; }
  .card:hover .card-img { transform: scale(1.05); }
  
  .card-score {
    position: absolute; top: .5rem; right: .5rem; background: rgba(0,0,0,.85); 
    padding: .15rem .4rem; border-radius: 4px; font-weight: 700; font-family: 'Space Mono', monospace; font-size: .7rem;
    color: var(--green); border: 1px solid var(--green);
  }

  .card-body { padding: .8rem; flex: 1; display: flex; flex-direction: column; gap: .4rem; }
  .card-title { font-size: .85rem; font-weight: 600; line-height: 1.3; }
  
  .tag { font-size: .55rem; font-weight: 700; padding: .1rem .3rem; border-radius: 3px; text-transform: uppercase; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .tag-platform { color: var(--accent); border-color: var(--accent-glow); }

  .card-players { display: flex; align-items: center; gap: .3rem; font-size: .8rem; font-weight: 700; color: #fff; margin-top: auto; }

  .modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.98); display: none; align-items: center; justify-content: center; }
  .modal.active { display: flex; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 16px; width: 400px; }
  
  .loader { width: 100%; height: 2px; background: var(--border); position: relative; overflow: hidden; margin: 10px 0; }
  .loader-bar { width: 40%; height: 100%; background: var(--accent); position: absolute; animation: scan 1.5s infinite ease-in-out; }
  @keyframes scan { from { left: -40%; } to { left: 100%; } }

  .btn-api { background: none; border: 1px solid var(--border); color: var(--muted); padding: .3rem .6rem; border-radius: 4px; cursor: pointer; font-size: .7rem; margin-left: auto; }
</style>
</head>
<body>

<div class="modal" id="apiModal">
  <div class="modal-content">
    <h2 style="margin-bottom:1rem; font-size:1.2rem;">API Keys</h2>
    <form id="apiForm">
      <div class="filter-group">
        <label class="label">TheGamesDB Key</label>
        <input type="password" id="tgdbKey" required>
      </div>
      <div class="filter-group">
        <label class="label">RAWG.io Key</label>
        <input type="password" id="rawgKey" required>
      </div>
      <button type="submit" class="btn-search">💾 Save & Launch</button>
    </form>
  </div>
</div>

<div class="layout">
  <aside>
    <div class="logo">Retro<span>CoOp</span></div>
    
    <div class="filter-group">
      <label class="label">Search by Title</label>
      <input type="text" id="searchTitle" placeholder="e.g. Contra, Mario">
    </div>

    <div class="filter-group">
      <label class="label">Platform</label>
      <select id="platform">
        <option value="7">NES</option>
        <option value="6">SNES</option>
        <option value="36">Genesis</option>
        <option value="2">Arcade</option>
        <option value="10">PS1</option>
        <option value="11">PS2</option>
        <option value="3">N64</option>
        <option value="4">GBA</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="label">Exact Min Players</label>
      <input type="number" id="minPlayers" value="2" min="1" max="16">
    </div>

    <button class="btn-search" id="searchBtn">🔍 Start Precision Scan</button>
    <div style="margin-top:2rem; display:flex;">
      <button class="btn-api" id="clearKeys">Reset Keys</button>
    </div>
  </aside>

  <main>
    <div class="results-info" id="status">Ready to scan hundreds of games...</div>
    <div class="loader" id="mainLoader" style="display:none;"><div class="loader-bar"></div></div>
    <div class="grid" id="gameGrid"></div>
  </main>
</div>

<script>
const CONFIG = {
  tgdb: localStorage.getItem('THEGAMESDB_KEY') || '',
  rawg: localStorage.getItem('RAWG_KEY') || ''
};

const $ = id => document.getElementById(id);
if (!CONFIG.tgdb || !CONFIG.rawg) $('apiModal').classList.add('active');

$('apiForm').onsubmit = (e) => {
  e.preventDefault();
  localStorage.setItem('THEGAMESDB_KEY', $('tgdbKey').value.trim());
  localStorage.setItem('RAWG_KEY', $('rawgKey').value.trim());
  location.reload();
};
$('clearKeys').onclick = () => { localStorage.clear(); location.reload(); };

const TGDB_BASE = 'https://api.thegamesdb.net/v1';
const RAWG_BASE = 'https://api.rawg.io/api';
const PROXY = 'https://corsproxy.io/?url=';

const PLATFORM_NAMES = { '7':'NES','6':'SNES','36':'Genesis','2':'Arcade','10':'PS1','11':'PS2','3':'N64','4':'GBA' };

let state = { page: 1, loading: false, foundCount: 0 };

$('searchBtn').onclick = () => {
  state.page = 1;
  state.foundCount = 0;
  $('gameGrid').innerHTML = '';
  startSearch();
};

async function startSearch() {
  if (state.loading) return;
  state.loading = true;
  $('searchBtn').disabled = true;
  $('mainLoader').style.display = 'block';

  const title = $('searchTitle').value.trim();
  const platform = $('platform').value;
  const minP = parseInt($('minPlayers').value) || 1;

  try {
    // Цикл: сканируем пока не найдем 20 игр или не пройдем 15 страниц (300 игр)
    while (state.foundCount < 20 && state.page < 15) {
      updateStatus(`Scanning Page ${state.page} (Found: ${state.foundCount})...`);
      
      let tgdbUrl = title 
        ? `${TGDB_BASE}/Games/ByGameName?name=${encodeURIComponent(title)}&page=${state.page}`
        : `${TGDB_BASE}/Games/ByPlatformID?id=${platform}&page=${state.page}`;
      
      tgdbUrl += `&apikey=${CONFIG.tgdb}&fields=players,release_date&include=boxart`;
      
      const res = await fetch(PROXY + encodeURIComponent(tgdbUrl));
      const json = await res.json();
      if (json.status !== 'Success' || !json.data.games) break;

      const boxart = json.include?.boxart || {};
      const filtered = json.data.games.filter(g => extractPlayers(g.players) >= minP);

      filtered.forEach(g => {
        renderCard(g, boxart);
        state.foundCount++;
      });

      state.page++;
      if (title) break; // Для поиска по имени выходим сразу
    }
    updateStatus(`Found ${state.foundCount} games. Enhancing quality...`);
    
    // Фоновое улучшение (картинки и рейтинги из RAWG)
    enhanceWithRAWG();

  } catch (err) { updateStatus(`Error: ${err.message}`); }
  finally {
    state.loading = false;
    $('searchBtn').disabled = false;
    $('mainLoader').style.display = 'none';
  }
}

function renderCard(g, boxartData) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `game-${g.id}`;
  
  let thumb = 'https://via.placeholder.com/300x400?text=No+Image';
  if (boxartData.data && boxartData.data[g.id]) {
    const img = boxartData.data[g.id].find(i => i.side === 'front') || boxartData.data[g.id][0];
    thumb = boxartData.base_url.thumb + img.filename;
  }

  card.innerHTML = `
    <div class="card-img-wrap">
      <img src="${thumb}" class="card-img" id="img-${g.id}">
      <div class="card-score" id="score-${g.id}" style="display:none"></div>
    </div>
    <div class="card-body">
      <div class="card-tags">
        <span class="tag tag-platform">${PLATFORM_NAMES[g.platform] || 'Retro'}</span>
        <span class="tag">${g.release_date?.slice(0,4) || '????'}</span>
      </div>
      <div class="card-title">${g.game_title}</div>
      <div class="card-players"><span>👥</span> ${extractPlayers(g.players)} Players</div>
    </div>
  `;
  $('gameGrid').appendChild(card);
}

async function enhanceWithRAWG() {
  const cards = document.querySelectorAll('.card');
  for (const card of cards) {
    const id = card.id.replace('game-', '');
    const title = card.querySelector('.card-title').textContent;
    
    try {
      const url = `${RAWG_BASE}/games?key=${CONFIG.rawg}&search=${encodeURIComponent(title)}&page_size=1`;
      const res = await fetch(url);
      const data = await res.json();
      const g = data.results?.[0];
      
      if (g) {
        if (g.background_image) $(`img-${id}`).src = g.background_image;
        if (g.metacritic) {
          const s = $(`score-${id}`);
          s.textContent = g.metacritic;
          s.style.display = 'block';
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 150)); // Бережем лимиты
  }
}

function extractPlayers(val) {
  if (!val) return 1;
  const m = String(val).match(/\d+/g);
  return m ? Math.max(...m.map(Number)) : 1;
}

function updateStatus(msg) { $('status').textContent = msg; }

window.onscroll = () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
    if (!state.loading && state.foundCount > 0) startSearch();
  }
};
</script>
</body>
</html>
