name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment: github-pages # Убираем привязку к окружению, если секреты созданы как Repository Secrets
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject API keys
        run: |
          # Отладочная информация (безопасная)
          echo "Checking if secrets are available..."
          if [ -z "${{ secrets.THEGAMESDB_KEY }}" ]; then echo "THEGAMESDB_KEY is EMPTY"; else echo "THEGAMESDB_KEY is PRESENT"; fi
          if [ -z "${{ secrets.RAWG_KEY }}" ]; then echo "RAWG_KEY is EMPTY"; else echo "RAWG_KEY is PRESENT"; fi

          # Замена с использованием временных переменных для надежности
          sed -i "s|const THEGAMESDB_KEY = '.*';|const THEGAMESDB_KEY = '${{ secrets.THEGAMESDB_KEY }}';|g" index.html
          sed -i "s|const RAWG_KEY = '.*';|const RAWG_KEY = '${{ secrets.RAWG_KEY }}';|g" index.html
          
          echo "Injection complete."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
