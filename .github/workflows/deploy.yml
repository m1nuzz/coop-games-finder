name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject API keys
        run: |
          # Используем более гибкий поиск для замены ключей
          sed -i "s|const THEGAMESDB_KEY = '.*';|const THEGAMESDB_KEY = '${{ secrets.THEGAMESDB_KEY }}';|g" index.html
          sed -i "s|const RAWG_KEY = '.*';|const RAWG_KEY = '${{ secrets.RAWG_KEY }}';|g" index.html
          
          # Проверка (выведет строки без самих ключей для безопасности)
          grep "const THEGAMESDB_KEY" index.html | sed 's/=.*/= "***";/'
          grep "const RAWG_KEY" index.html | sed 's/=.*/= "***";/'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
